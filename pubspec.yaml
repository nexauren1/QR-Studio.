name: qr_studio
description: QR Studio by Nexauren — create, scan, style and share QR codes and barcodes.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
