name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner (Java activity)
        run: bash tool/bootstrap_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build ARM APK variants
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Enforce 30 MB download ceiling
        shell: bash
        run: |
          set -euo pipefail
          max_bytes=$((30 * 1024 * 1024))
          for apk in build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk; do
            test -f "$apk"
            size=$(stat -c%s "$apk")
            echo "$apk: $(numfmt --to=iec-i --suffix=B "$size")"
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error::$apk exceeds the 30 MB download ceiling."
              exit 1
            fi
          done

      - name: Upload ARM APKs
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-android-arm-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
