name: Android Universal APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner (Java activity)
        run: bash tool/bootstrap_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build one universal ARM APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Report universal APK size
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk"
          size=$(stat -c%s "$apk")
          readable_size=$(numfmt --to=iec-i --suffix=B "$size")
          echo "Universal APK: $readable_size ($size bytes)"
          {
            echo "### Universal Android APK"
            echo "- File: app-release.apk"
            echo "- Download size: $readable_size ($size bytes)"
            echo "- Architectures: ARM32 (armeabi-v7a) and ARM64 (arm64-v8a)"
            echo "- Delivery: one APK containing both supported ARM architectures"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Dart symbol maps
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-dart-symbols
          path: build/symbols/
          if-no-files-found: warn
