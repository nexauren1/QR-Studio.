name: Android Universal APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner (Java activity)
        run: bash tool/bootstrap_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build one universal ARM APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Enforce 30 MB universal download ceiling
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          max_bytes=30000000
          test -f "$apk"
          size=$(stat -c%s "$apk")
          echo "$apk: $(numfmt --to=iec-i --suffix=B "$size") ($size bytes)"
          if [ "$size" -gt "$max_bytes" ]; then
            echo "::error::The universal APK exceeds the 30 MB download ceiling."
            exit 1
          fi

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Dart symbol maps
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-dart-symbols
          path: build/symbols/
          if-no-files-found: warn
