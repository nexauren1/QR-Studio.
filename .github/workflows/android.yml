name: Android Universal APK

on:
  push:
    branches: [main, release/final-launch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner (Java activity)
        run: bash tool/bootstrap_android.sh

      - name: Configure permanent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing GitHub secret KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing GitHub secret KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing GitHub secret KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing GitHub secret KEY_PASSWORD}"
          mkdir -p android/app
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ["KEYSTORE_BASE64"].strip()
          if encoded.startswith("base64:"):
              encoded = encoded.split(":", 1)[1]
          if encoded.startswith("data:") and "," in encoded:
              encoded = encoded.split(",", 1)[1]
          encoded = "".join(encoded.split()).strip('"').strip("'")
          encoded += "=" * (-len(encoded) % 4)
          try:
              keystore = base64.b64decode(encoded, altchars=b"-_", validate=True)
          except Exception as error:
              raise SystemExit(
                  "KEYSTORE_BASE64 is not valid Base64. Copy only the Base64 value "
                  "for the .jks file into this GitHub secret."
              ) from error
          if not keystore:
              raise SystemExit("The decoded Android keystore is empty.")
          path = Path("android/app/qr-studio-upload-keystore.jks")
          path.write_bytes(keystore)
          path.chmod(0o600)
          PY
          printf 'storeFile=qr-studio-upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          chmod 600 android/key.properties
          keytool -list -v \
            -keystore android/app/qr-studio-upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" >/dev/null
          echo "Release keystore decoded and validated."

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit and widget tests
        run: flutter test

      - name: Build signed universal ARM APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Verify APK signature and report size
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk"
          apksigner verify --verbose --print-certs "$apk" > build/apk-signature.txt
          cat build/apk-signature.txt
          size=$(stat -c%s "$apk")
          readable_size=$(numfmt --to=iec-i --suffix=B "$size")
          echo "Signed universal APK: $readable_size ($size bytes)"
          {
            echo "### Signed Universal Android APK"
            echo "- File: app-release.apk"
            echo "- Download size: $readable_size ($size bytes)"
            echo "- Architectures: ARM32 (armeabi-v7a) and ARM64 (arm64-v8a)"
            echo "- Signing: permanent QR Studio release keystore"
            echo "- Delivery: one APK containing both supported ARM architectures"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-universal-apk-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Dart symbol maps
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qr-studio-dart-symbols
          path: build/symbols/
          if-no-files-found: warn
          retention-days: 30
